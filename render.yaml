services:
  - type: web
    name: newsroom-michkffm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: gunicorn --config gunicorn.conf.py server.app:application
    healthCheckPath: /health
    envVars:
      - key: GUARDIAN_API_KEY
        sync: false
